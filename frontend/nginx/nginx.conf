# Nginx: HTTPS obligatorio, proxy inverso a la API y cabeceras de seguridad
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
  listen 80;
  server_name _;
  location = /healthz { access_log off; return 200 "ok"; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/sigm.crt;
  ssl_certificate_key /etc/nginx/certs/sigm.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;

  server_tokens off;
  client_max_body_size 20m;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

  # Limitación de solicitudes al inicio de sesión (complementa la del backend)
  location = /api/v1/auth/login {
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://api:3000;
    include /etc/nginx/conf.d/proxy_params.inc;
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_read_timeout 180s;
    include /etc/nginx/conf.d/proxy_params.inc;
  }

  location /assets/ {
    root /usr/share/nginx/html;
    expires 30d;  # sin add_header aquí: se conservan las cabeceras de seguridad del server
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
    expires -1;
  }
}

